name: Make and post a Short

on:
  schedule:
    - cron: "23 17 * * *"
    - cron: "23 22 * * *"
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Upload to YouTube? (leave off to just make a test video you can download)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -r requirements.txt

      - name: Make the video (and post it)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.post }}" = "true" ]; then
            python -m bot.story.make --post
          else
            python -m bot.story.make
          fi

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: out/short.mp4
          retention-days: 7

      - name: Save history
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Posted a short" && git push)
